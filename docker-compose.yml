services:
  postgres:
    image: postgres:17

    container_name: echo-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: echo
      POSTGRES_PASSWORD: echo_dev_password
      POSTGRES_DB: echo_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: